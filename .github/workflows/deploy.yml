name: Deploy

# Deploys main once CI has passed on it. Builds the ARM image on GitHub's
# ARM runner, pushes it to ECR, then runs deploy/host/deploy.sh on the shared
# instance over SSM. AWS access is through the OIDC deploy role, which trusts
# only this repo's main branch.

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  AWS_REGION: ${{ vars.AWS_REGION }}
  SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  build:
    name: Build and push image
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-24.04-arm
    outputs:
      image: ${{ steps.image.outputs.image }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7
      - id: image
        run: echo "image=${{ vars.ECR_REPOSITORY_URL }}:${SHA}" >> "$GITHUB_OUTPUT"
      - name: Build and push (skipped if this commit's image exists)
        env:
          IMAGE: ${{ steps.image.outputs.image }}
        run: |
          if docker manifest inspect "$IMAGE" >/dev/null 2>&1; then
            echo "$IMAGE already in ECR"
          else
            docker build --platform linux/arm64 -t "$IMAGE" .
            docker push "$IMAGE"
          fi

  deploy:
    name: Deploy to the instance
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.SHA }}
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ vars.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Run deploy.sh over SSM
        env:
          IMAGE: ${{ needs.build.outputs.image }}
          INSTANCE_ID: ${{ vars.INSTANCE_ID }}
        run: |
          set -euo pipefail
          PAYLOAD=$(tar -C deploy -czf - . | base64 -w0)
          PARAMS=$(python3 -c '
          import json, sys
          payload, image = sys.argv[1], sys.argv[2]
          print(json.dumps({
            "executionTimeout": ["900"],
            "commands": [
              "set -euo pipefail",
              "STAGE=$(mktemp -d)",
              "trap \"rm -rf $STAGE\" EXIT",
              "echo " + payload + " | base64 -d | tar -C \"$STAGE\" -xzf -",
              "bash \"$STAGE/host/deploy.sh\" " + image,
            ],
          }))' "$PAYLOAD" "$IMAGE")
          CMD_ID=$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript \
            --comment "mysignalchain deploy ${SHA::7}" \
            --parameters "$PARAMS" --query Command.CommandId --output text)
          echo "SSM command $CMD_ID"
          while :; do
            STATUS=$(aws ssm get-command-invocation --command-id "$CMD_ID" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/dev/null || echo Pending)
            case "$STATUS" in Pending|InProgress|Delayed) sleep 5 ;; *) break ;; esac
          done
          aws ssm get-command-invocation --command-id "$CMD_ID" --instance-id "$INSTANCE_ID" \
            --query '[StandardOutputContent,StandardErrorContent]' --output text
          echo "status: $STATUS"
          [ "$STATUS" = Success ]
      - name: Check the site from outside
        run: |
          for i in $(seq 1 10); do
            code=$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${{ vars.SITE_URL }}/api/health" || true)
            [ "$code" = 200 ] && { echo "health 200"; exit 0; }
            sleep 3
          done
          echo "health check from outside failed (last: $code)"; exit 1
