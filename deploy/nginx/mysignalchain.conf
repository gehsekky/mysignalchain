# mysignalchain's site file for the shared edge proxy (edge-nginx, defined in
# gehsekky-infra under host/edge/). deploy/host/deploy.sh installs it to
# /opt/edge/sites/mysignalchain.conf, testing with `nginx -t` first.
#
# The certificate covers mysignalchain.com and www, issued with
# `certbot certonly --webroot` on the host and renewed by its timer; the
# shared deploy hook reloads edge-nginx after each renewal.

# HTTP: certificate challenges, everything else to HTTPS on the apex.
server {
    listen 80;
    server_name mysignalchain.com www.mysignalchain.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://mysignalchain.com$request_uri;
    }
}

# www to the apex.
server {
    listen 443 ssl;
    server_name www.mysignalchain.com;
    http2 on;

    ssl_certificate     /etc/letsencrypt/live/mysignalchain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mysignalchain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    return 301 https://mysignalchain.com$request_uri;
}

server {
    listen 443 ssl;
    server_name mysignalchain.com;
    http2 on;

    ssl_certificate     /etc/letsencrypt/live/mysignalchain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/mysignalchain.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    location / {
        # In a variable so Nginx resolves it per request: if the app is down
        # this returns 502 instead of stopping the proxy for every site.
        set $mysignalchain_app http://mysignalchain-app:3000;
        proxy_pass $mysignalchain_app;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        # Overwrite, never append: the app trusts these for rate limiting
        # and session records, so clients mustn't be able to set them.
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
